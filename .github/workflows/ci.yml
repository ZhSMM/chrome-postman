# ============================================================
# CI —— 每次 push / PR 都跑一遍
# 目的：在合并前拦住"类型不过 / 测试挂了 / 构建产物不对"
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一个分支的新提交会取消掉还没跑完的旧提交，节省 CI 配额
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 / 单元测试 / 构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 伴生程序自测（native messaging 协议）
        run: node native-host/selftest.mjs

      - name: 构建（UI + Service Worker + 图标）
        run: npm run build:all

      # pack.mjs 现在会产出两个 zip（扩展本体 + 伴生程序），
      # 所以这里要逐个列，不能用 `unzip -l release/*.zip`（那会把两个文件都传给 unzip）。
      - name: 打包并校验 zip 结构
        run: |
          node scripts/pack.mjs
          for z in release/*.zip; do
            echo "=== $z ==="
            unzip -l "$z"
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: chrome-postman-${{ github.sha }}
          path: release/*.zip
          retention-days: 14
