<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chrome Postman</title>
    <style>
      body {
        margin: 0;
        width: 300px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #1c1c1e;
        color: #e8e8ea;
        font-size: 13px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid #35353a;
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: linear-gradient(135deg, #ff6b35, #ff9f45);
        display: grid;
        place-items: center;
        font-size: 11px;
        color: #fff;
        font-weight: 700;
      }
      .row {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      label {
        color: #9a9aa2;
        font-size: 12px;
      }
      select,
      button {
        font-family: inherit;
        font-size: 13px;
        border-radius: 6px;
        padding: 7px 9px;
        border: 1px solid #35353a;
        background: #141416;
        color: #e8e8ea;
      }
      button {
        cursor: pointer;
        background: #ff6b35;
        border-color: #ff6b35;
        color: #fff;
        font-weight: 600;
      }
      button:hover {
        background: #ff8559;
      }
      .ghost {
        background: #141416;
        border-color: #35353a;
        color: #e8e8ea;
        font-weight: 400;
      }
      .ghost:hover {
        background: #2f2f34;
      }
      .stats {
        padding: 0 12px 12px;
        color: #6b6b74;
        font-size: 11.5px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
